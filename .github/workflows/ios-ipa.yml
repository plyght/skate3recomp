# Builds Skate3Recomp.ipa in the cloud from YOUR copy of the game - no Mac
# needed. Everything can be done from a phone:
#   1. Share your Skate 3 ISO from iCloud Drive / Google Drive / Dropbox and
#      save its direct download link as the secret SKATE3_ISO_URL.
#   2. Actions > "iOS app" > Run workflow.
#   3. Download the Skate3Recomp-ipa artifact and open it in SideStore.
#
# Only default.xex and EAWebkit.xex are taken from the ISO (the rest of the
# disc is read on the device later); the title update is downloaded from the
# same source the desktop installer uses.
#
# In a PRIVATE repository the .ipa is uploaded as-is. In a public one the
# artifact would be downloadable by anyone, so the workflow then requires the
# secret SKATE3_FILES_PASSWORD and uploads the .ipa encrypted with it
# (decrypt with ios/decrypt-ipa.sh).
name: iOS app (.ipa from your game files)

on:
  workflow_dispatch:
    inputs:
      extended_va:
        description: "Request extended virtual addressing (paid Apple developer account only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-ipa
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      SKATE3_ISO_URL: ${{ secrets.SKATE3_ISO_URL }}
      SKATE3_FILES_URL: ${{ secrets.SKATE3_FILES_URL }}
      SKATE3_FILES_PASSWORD: ${{ secrets.SKATE3_FILES_PASSWORD }}
      REPO_PRIVATE: ${{ github.event.repository.private }}
      # Keep compiler diagnostics (which quote recompiled code) out of the
      # public log, and stay within the runner's 7 GB of RAM.
      CXXFLAGS: -w
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - name: Check secrets
        run: |
          if [[ -z "$SKATE3_ISO_URL" && -z "$SKATE3_FILES_URL" ]]; then
            echo "::error::Add the secret SKATE3_ISO_URL (a direct download link to your Skate 3 ISO)."
            exit 1
          fi
          if [[ "$REPO_PRIVATE" != "true" && -z "$SKATE3_FILES_PASSWORD" ]]; then
            echo "::error::This repository is public, so the .ipa must be encrypted: add the secret SKATE3_FILES_PASSWORD, or make the repository private."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Initialize submodules
        run: ios/ensure-submodules.sh

      - name: Select Xcode with the iOS 26 SDK
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install toolchain
        run: brew install llvm ninja

      - name: Fetch your game files
        run: |
          inputs="$RUNNER_TEMP/game"
          mkdir -p "$inputs/data/webkit"
          if [[ -n "$SKATE3_ISO_URL" ]]; then
            # Pull the two executables out of the ISO, then delete it right away
            # (runner disk is limited and nothing else from the disc is needed).
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/game.iso" "$SKATE3_ISO_URL"
            python3 -I - "$RUNNER_TEMP/game.iso" "$inputs" ios/pack-game-files.py <<'PY'
          import importlib.util, pathlib, sys
          iso, out, packer = sys.argv[1:4]
          spec = importlib.util.spec_from_file_location("packer", packer)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          for name, data in mod.find_files(iso).items():
              path = pathlib.Path(out) / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          PY
            rm -f "$RUNNER_TEMP/game.iso"
            curl -fsSL --retry 3 -o "$inputs/TU_12K2276_000000C000000.00000000000O3" \
              "https://xboxunity.net/Resources/Lib/TitleUpdate.php?tuid=21774"
          else
            # Pre-packed archive from ios/pack-game-files.py.
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/inputs.enc" "$SKATE3_FILES_URL"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
              -pass env:SKATE3_FILES_PASSWORD -in "$RUNNER_TEMP/inputs.enc" \
              | tar -xzf - -C "$inputs"
            rm -f "$RUNNER_TEMP/inputs.enc"
          fi
          test -f "$inputs/default.xex" -a -f "$inputs/data/webkit/EAWebkit.xex" \
            || { echo "::error::Could not get default.xex / EAWebkit.xex from your files"; exit 1; }

      - name: Build the app
        run: |
          args=(--game "$RUNNER_TEMP/game" --tu "$RUNNER_TEMP/game/TU_12K2276_000000C000000.00000000000O3")
          if [[ "${{ inputs.extended_va }}" == "true" ]]; then
            args+=(--extended-va)
          fi
          ios/build.sh "${args[@]}"

      - name: Prepare the .ipa for upload
        run: |
          if [[ "$REPO_PRIVATE" == "true" ]]; then
            cp out/build/ios-release/Skate3Recomp.ipa "$RUNNER_TEMP/Skate3Recomp.ipa"
          else
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
              -pass env:SKATE3_FILES_PASSWORD \
              -in out/build/ios-release/Skate3Recomp.ipa \
              -out "$RUNNER_TEMP/Skate3Recomp.ipa.enc"
          fi

      - name: Remove plaintext game-derived files
        if: always()
        run: rm -rf "$RUNNER_TEMP/game" "$RUNNER_TEMP/game.iso" generated out/build

      - uses: actions/upload-artifact@v4
        with:
          name: Skate3Recomp-ipa
          path: |
            ${{ runner.temp }}/Skate3Recomp.ipa
            ${{ runner.temp }}/Skate3Recomp.ipa.enc
          retention-days: 3
          if-no-files-found: error
